<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Tech Indigo to Cyan -->
    <linearGradient id="poly-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    
    <!-- Outer Rim Glow -->
    <linearGradient id="poly-rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Center Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#poly-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#poly-rim)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Subtle Inner Glass Highlight -->
  <path d="M4 18C4 10.268 10.268 4 18 4H46C53.732 4 60 10.268 60 18V28C45 28 20 32 4 44V18Z" fill="white" fill-opacity="0.14"/>

  <!-- Primary 4-Point Sparkle (PolySkill Star Emblem) -->
  <g filter="url(#glow)">
    <path d="M31.02 12.8C31.42 10.6 34.58 10.6 34.98 12.8L37.1 24.2C37.6 26.9 39.1 28.4 41.8 28.9L53.2 31.02C55.4 31.42 55.4 34.58 53.2 34.98L41.8 37.1C39.1 37.6 37.6 39.1 37.1 41.8L34.98 53.2C34.58 55.4 31.42 55.4 31.02 53.2L28.9 41.8C28.4 39.1 26.9 37.6 24.2 37.1L12.8 34.98C10.6 34.58 10.6 31.42 12.8 31.02L24.2 28.9C26.9 28.4 28.4 26.9 28.9 24.2L31.02 12.8Z" fill="#FFFFFF"/>
    
    <!-- Inner Core Sparkle for Dimensional Depth -->
    <path d="M32.2 20.5C32.4 19.3 33.6 19.3 33.8 20.5L34.9 27.2C35.4 29.8 36.2 30.6 38.8 31.1L45.5 32.2C46.7 32.4 46.7 33.6 45.5 33.8L38.8 34.9C36.2 35.4 35.4 36.2 34.9 38.8L33.8 45.5C33.6 46.7 32.4 46.7 32.2 45.5L31.1 38.8C30.6 36.2 29.8 35.4 27.2 34.9L20.5 33.8C19.3 33.6 19.3 32.4 20.5 32.2L27.2 31.1C29.8 30.6 30.6 29.8 31.1 27.2L32.2 20.5Z" fill="#E0F2FE"/>
  </g>

  <!-- Accent Energy Spark (Gold/Amber Node) -->
  <path d="M47.2 13.5C47.4 12.5 48.6 12.5 48.8 13.5L49.6 17.6C49.9 19 51 20.1 52.4 20.4L56.5 21.2C57.5 21.4 57.5 22.6 56.5 22.8L52.4 23.6C51 23.9 49.9 25 49.6 26.4L48.8 30.5C48.6 31.5 47.4 31.5 47.2 30.5L46.4 26.4C46.1 25 45 23.9 43.6 23.6L39.5 22.8C38.5 22.6 38.5 21.4 39.5 21.2L43.6 20.4C45 20.1 46.1 19 46.4 17.6L47.2 13.5Z" fill="#FBBF24"/>

  <!-- Minor Accent Sparkle at bottom left -->
  <circle cx="16" cy="46" r="2.5" fill="#67E8F9"/>
</svg>
